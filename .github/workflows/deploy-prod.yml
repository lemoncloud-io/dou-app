name: deploy-prod
on:
    push:
        branches:
            - main

jobs:
    changes:
        name: Check changed projects
        runs-on: ubuntu-latest
        outputs:
            web: ${{ steps.filter.outputs.web == 'true' && 'true' || 'false' }}
            # admin is not supported yet — force-skip its build/deploy (shared-lib break in
            # libs/socket → web-core fails admin:build). Downstream jobs read this output.
            admin: 'false'
            landing: ${{ steps.filter.outputs.landing == 'true' && 'true' || 'false' }}
            desktopweb: ${{ steps.filter.outputs.desktopweb == 'true' && 'true' || 'false' }}
            blockkitbuilder: ${{ steps.filter.outputs.blockkitbuilder == 'true' && 'true' || 'false' }}
            projects: ${{ steps.filter.outputs.changes }}
            matrix: ${{ steps.set-matrix.outputs.matrix }}
            has-changes: ${{ steps.set-matrix.outputs.has-changes }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: main

            - uses: dorny/paths-filter@v2
              id: filter
              with:
                  base: 'main'
                  filters: |
                      admin:
                          - 'apps/admin/src/**'
                          - 'apps/admin/public/**'
                          - 'apps/admin/index.html'
                          - 'apps/admin/vite.config.mts'
                          - 'apps/admin/project.json'
                          - 'apps/admin/tsconfig*.json'
                          - 'apps/admin/tailwind.config.js'
                          - 'apps/admin/postcss.config.js'
                          # Shared sources. Every deployable app compiles these in, so a change
                          # confined to one of them has to redeploy the app that carries it.
                          #
                          # `libs/**` deliberately, not the specific libs this app imports. A
                          # hand-maintained list is what produced the bug this replaces: the
                          # filters listed only `apps/<name>/**`, so a change to libs/data,
                          # libs/shared or libs/policy-content set has-changes=false and shipped
                          # nothing — a legal-text fix would sit on the branch until an unrelated
                          # app change carried it out. Over-deploying costs a build; under-deploying
                          # is silent. If the wasted builds ever matter, derive the set from
                          # `nx affected` rather than by hand.
                          - 'libs/**'
                          - 'assets/**'
                      web:
                          - 'apps/web/src/**'
                          - 'apps/web/public/**'
                          - 'apps/web/index.html'
                          - 'apps/web/vite.config.mts'
                          - 'apps/web/project.json'
                          - 'apps/web/tsconfig*.json'
                          - 'apps/web/tailwind.config.js'
                          - 'apps/web/postcss.config.js'
                          # Shared sources. Every deployable app compiles these in, so a change
                          # confined to one of them has to redeploy the app that carries it.
                          #
                          # `libs/**` deliberately, not the specific libs this app imports. A
                          # hand-maintained list is what produced the bug this replaces: the
                          # filters listed only `apps/<name>/**`, so a change to libs/data,
                          # libs/shared or libs/policy-content set has-changes=false and shipped
                          # nothing — a legal-text fix would sit on the branch until an unrelated
                          # app change carried it out. Over-deploying costs a build; under-deploying
                          # is silent. If the wasted builds ever matter, derive the set from
                          # `nx affected` rather than by hand.
                          - 'libs/**'
                          - 'assets/**'
                      landing:
                          - 'apps/landing/src/**'
                          - 'apps/landing/public/**'
                          - 'apps/landing/index.html'
                          - 'apps/landing/vite.config.mts'
                          - 'apps/landing/project.json'
                          - 'apps/landing/tsconfig*.json'
                          - 'apps/landing/tailwind.config.js'
                          - 'apps/landing/postcss.config.js'
                          # Shared sources. Every deployable app compiles these in, so a change
                          # confined to one of them has to redeploy the app that carries it.
                          #
                          # `libs/**` deliberately, not the specific libs this app imports. A
                          # hand-maintained list is what produced the bug this replaces: the
                          # filters listed only `apps/<name>/**`, so a change to libs/data,
                          # libs/shared or libs/policy-content set has-changes=false and shipped
                          # nothing — a legal-text fix would sit on the branch until an unrelated
                          # app change carried it out. Over-deploying costs a build; under-deploying
                          # is silent. If the wasted builds ever matter, derive the set from
                          # `nx affected` rather than by hand.
                          - 'libs/**'
                          - 'assets/**'
                      desktopweb:
                          - 'apps/desktop-web/src/**'
                          - 'apps/desktop-web/index.html'
                          - 'apps/desktop-web/vite.config.mts'
                          - 'apps/desktop-web/project.json'
                          - 'apps/desktop-web/tsconfig*.json'
                          - 'apps/desktop-web/tailwind.config.js'
                          - 'apps/desktop-web/postcss.config.js'
                          # Shared sources. Every deployable app compiles these in, so a change
                          # confined to one of them has to redeploy the app that carries it.
                          #
                          # `libs/**` deliberately, not the specific libs this app imports. A
                          # hand-maintained list is what produced the bug this replaces: the
                          # filters listed only `apps/<name>/**`, so a change to libs/data,
                          # libs/shared or libs/policy-content set has-changes=false and shipped
                          # nothing — a legal-text fix would sit on the branch until an unrelated
                          # app change carried it out. Over-deploying costs a build; under-deploying
                          # is silent. If the wasted builds ever matter, derive the set from
                          # `nx affected` rather than by hand.
                          - 'libs/**'
                          - 'assets/**'
                      blockkitbuilder:
                          - 'apps/block-kit-builder/src/**'
                          - 'apps/block-kit-builder/index.html'
                          - 'apps/block-kit-builder/vite.config.mts'
                          - 'apps/block-kit-builder/project.json'
                          - 'apps/block-kit-builder/tsconfig*.json'
                          - 'apps/block-kit-builder/tailwind.config.js'
                          - 'apps/block-kit-builder/postcss.config.js'
                          # Shared sources. Every deployable app compiles these in, so a change
                          # confined to one of them has to redeploy the app that carries it.
                          #
                          # `libs/**` deliberately, not the specific libs this app imports. A
                          # hand-maintained list is what produced the bug this replaces: the
                          # filters listed only `apps/<name>/**`, so a change to libs/data,
                          # libs/shared or libs/policy-content set has-changes=false and shipped
                          # nothing — a legal-text fix would sit on the branch until an unrelated
                          # app change carried it out. Over-deploying costs a build; under-deploying
                          # is silent. If the wasted builds ever matter, derive the set from
                          # `nx affected` rather than by hand.
                          - 'libs/**'
                          - 'assets/**'

            - name: Set matrix for changed projects
              id: set-matrix
              run: |
                  PROJECTS=()
                  [[ "${{ steps.filter.outputs.web }}" == "true" ]] && PROJECTS+=('"web"')
                  # admin not supported yet — never add it to the deploy matrix.
                  # [[ "${{ steps.filter.outputs.admin }}" == "true" ]] && PROJECTS+=('"admin"')
                  [[ "${{ steps.filter.outputs.landing }}" == "true" ]] && PROJECTS+=('"landing"')
                  [[ "${{ steps.filter.outputs.desktopweb }}" == "true" ]] && PROJECTS+=('"desktop-web"')
                  [[ "${{ steps.filter.outputs.blockkitbuilder }}" == "true" ]] && PROJECTS+=('"block-kit-builder"')

                  if [ ${#PROJECTS[@]} -eq 0 ]; then
                      echo "matrix=[]" >> $GITHUB_OUTPUT
                      echo "has-changes=false" >> $GITHUB_OUTPUT
                  else
                      MATRIX="[$(IFS=,; echo "${PROJECTS[*]}")]"
                      echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT
                      echo "has-changes=true" >> $GITHUB_OUTPUT
                  fi

    get-version:
        needs: changes
        if: ${{ needs.changes.outputs.admin == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.landing == 'true' || needs.changes.outputs.desktopweb == 'true' || needs.changes.outputs.blockkitbuilder == 'true' }}
        name: Build and Set Version
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        outputs:
            root-version: ${{ steps.get-root-version.outputs.root-version }}
            web-version: ${{ steps.get-web-version.outputs.web-version }}
            admin-version: ${{ steps.get-admin-version.outputs.admin-version }}
            landing-version: ${{ steps.get-landing-version.outputs.landing-version }}
            desktopweb-version: ${{ steps.get-desktopweb-version.outputs.desktopweb-version }}
        steps:
            - name: Check out a copy of the repo
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.LEMON_BOT_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version-file: '.nvmrc'

            - name: Get Yarn cache path
              id: yarn-cache-dir-path
              run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

            - name: Cache dependencies
              id: cache-dependencies
              uses: actions/cache@v3
              with:
                  path: |
                      ${{ steps.yarn-cache-dir-path.outputs.dir }}
                      node_modules
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Install dependencies
              if: steps.cache-dependencies.outputs.cache-hit != 'true'
              run: yarn install --frozen-lockfile

            - name: Configure git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Get Root Version
              id: get-root-version
              run: |
                  ROOT_VERSION=$(node -p "require('./package.json').version")
                  if ! echo "$ROOT_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                    echo "Error: Invalid root version format: $ROOT_VERSION"
                    exit 1
                  fi
                  echo "root-version=${ROOT_VERSION}" >> $GITHUB_OUTPUT

            - name: Get Web Version
              if: ${{ needs.changes.outputs.web == 'true' }}
              id: get-web-version
              run: |
                  WEB_VERSION=$(node -p "require('./apps/web/package.json').version")
                  if ! echo "$WEB_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                    echo "Error: Invalid web version format: $WEB_VERSION"
                    exit 1
                  fi
                  echo "web-version=${WEB_VERSION}" >> $GITHUB_OUTPUT

            - name: Get Admin Version
              if: ${{ needs.changes.outputs.admin == 'true' }}
              id: get-admin-version
              run: |
                  ADMIN_VERSION=$(node -p "require('./apps/admin/package.json').version")
                  if ! echo "$ADMIN_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                    echo "Error: Invalid admin version format: $ADMIN_VERSION"
                    exit 1
                  fi
                  echo "admin-version=${ADMIN_VERSION}" >> $GITHUB_OUTPUT

            - name: Get Landing Version
              if: ${{ needs.changes.outputs.landing == 'true' }}
              id: get-landing-version
              run: |
                  LANDING_VERSION=$(node -p "require('./apps/landing/package.json').version")
                  if ! echo "$LANDING_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                    echo "Error: Invalid landing version format: $LANDING_VERSION"
                    exit 1
                  fi
                  echo "landing-version=${LANDING_VERSION}" >> $GITHUB_OUTPUT

            - name: Get DesktopWeb Version
              if: ${{ needs.changes.outputs.desktopweb == 'true' }}
              id: get-desktopweb-version
              run: |
                  DESKTOPWEB_VERSION=$(node -p "require('./apps/desktop-web/package.json').version")
                  if ! echo "$DESKTOPWEB_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                    echo "Error: Invalid desktop-web version format: $DESKTOPWEB_VERSION"
                    exit 1
                  fi
                  echo "desktopweb-version=${DESKTOPWEB_VERSION}" >> $GITHUB_OUTPUT

    build-and-deploy:
        needs: [changes, get-version]
        if: ${{ needs.changes.outputs.has-changes == 'true' }}
        runs-on: ubuntu-latest
        name: Build and Deploy
        strategy:
            fail-fast: false
            matrix:
                project: ${{ fromJson(needs.changes.outputs.matrix) }}
                include:
                    - project: web
                      prefix: WEB
                    - project: admin
                      prefix: ADMIN
                    # landing reuses WEB_* env secrets too: its account surface signs in to the web app's
                    # relay session, so every address must match the web app's. Only its S3/CloudFront
                    # target differs (LANDING_* in the deploy step).
                    - project: landing
                      prefix: WEB
                    # desktop-web reuses WEB_* env secrets (same backend/firebase config);
                    # only its S3/CloudFront target differs (DESKTOP_* in the deploy step).
                    - project: desktop-web
                      prefix: WEB
                    # No prefix: the builder reads no VITE_* at all, and the env-file
                    # step below is skipped for it rather than writing an empty file.
                    - project: block-kit-builder

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.LEMON_BOT_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'

            - name: Get Yarn cache path
              id: yarn-cache-dir-path
              run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

            - name: Cache dependencies
              id: cache-dependencies
              uses: actions/cache@v3
              with:
                  path: |
                      ${{ steps.yarn-cache-dir-path.outputs.dir }}
                      node_modules
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Install dependencies
              if: ${{ steps.cache-dependencies.outputs.cache-hit != 'true' }}
              run: yarn install --frozen-lockfile

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

            - name: Generate env file
              # Every VITE_* would resolve empty for the builder, and the step's
              # `grep -v '=$'` then matches no line and exits 1, killing it under
              # `set -e`. The builder has no `import.meta.env` reference to feed.
              # The VITE_D1_*/VITE_V1_* lines are admin's per-stage targets, one value for every
              # build. Relay, archive and socket are the web app's own servers, so they reuse its
              # DEV/PROD secrets; goods and presence have ADMIN_<STAGE>_* secrets of their own.
              # Other apps get empty values, dropped below.
              if: ${{ matrix.project != 'block-kit-builder' }}
              run: |
                  set -e
                  ENV_FILE="apps/${{ matrix.project }}/.env"
                  cat > "$ENV_FILE" << 'EOF'
                  VITE_ENV=${{ secrets[format('{0}_PROD_ENV', matrix.prefix)] }}
                  VITE_PROJECT=${{ secrets[format('{0}_PROD_PROJECT', matrix.prefix)] }}
                  VITE_OAUTH_ENDPOINT=${{ secrets[format('{0}_PROD_OAUTH_ENDPOINT', matrix.prefix)] }}
                  VITE_HOST=${{ secrets[format('{0}_PROD_HOST', matrix.prefix)] }}
                  VITE_SOCIAL_OAUTH_ENDPOINT=${{ secrets[format('{0}_PROD_SOCIAL_OAUTH_ENDPOINT', matrix.prefix)] }}
                  VITE_IMAGE_API_ENDPOINT=${{ secrets[format('{0}_PROD_IMAGE_API_ENDPOINT', matrix.prefix)] }}
                  VITE_BACKEND_ENDPOINT=${{ secrets[format('{0}_PROD_BACKEND_ENDPOINT', matrix.prefix)] }}
                  VITE_WS_ENDPOINT=${{ secrets[format('{0}_PROD_WS_ENDPOINT', matrix.prefix)] }}
                  VITE_DOU_ENDPOINT=${{ secrets[format('{0}_PROD_DOU_ENDPOINT', matrix.prefix)] }}
                  VITE_ARCHIVE_ENDPOINT=${{ secrets[format('{0}_PROD_ARCHIVE_ENDPOINT', matrix.prefix)] }}
                  VITE_SOC_ENDPOINT=${{ secrets[format('{0}_PROD_SOC_ENDPOINT', matrix.prefix)] }}
                  VITE_IAP_ENDPOINT=${{ secrets[format('{0}_PROD_IAP_ENDPOINT', matrix.prefix)] }}
                  VITE_FRONT_ENDPOINT=${{ secrets[format('{0}_PROD_FRONT_ENDPOINT', matrix.prefix)] }}
                  VITE_DEBUG_CODE=${{ secrets[format('{0}_PROD_DEBUG_CODE', matrix.prefix)] }}
                  VITE_D1_RELAY_ENDPOINT=${{ matrix.prefix == 'ADMIN' && secrets.WEB_DEV_DOU_ENDPOINT || '' }}
                  VITE_V1_RELAY_ENDPOINT=${{ matrix.prefix == 'ADMIN' && secrets.WEB_PROD_DOU_ENDPOINT || '' }}
                  VITE_D1_GOODS_ENDPOINT=${{ secrets[format('{0}_D1_GOODS_ENDPOINT', matrix.prefix)] }}
                  VITE_V1_GOODS_ENDPOINT=${{ secrets[format('{0}_V1_GOODS_ENDPOINT', matrix.prefix)] }}
                  VITE_D1_ARCHIVE_ENDPOINT=${{ matrix.prefix == 'ADMIN' && secrets.WEB_DEV_ARCHIVE_ENDPOINT || '' }}
                  VITE_V1_ARCHIVE_ENDPOINT=${{ matrix.prefix == 'ADMIN' && secrets.WEB_PROD_ARCHIVE_ENDPOINT || '' }}
                  VITE_D1_PRESENCE_ENDPOINT=${{ secrets[format('{0}_D1_PRESENCE_ENDPOINT', matrix.prefix)] }}
                  VITE_V1_PRESENCE_ENDPOINT=${{ secrets[format('{0}_V1_PRESENCE_ENDPOINT', matrix.prefix)] }}
                  VITE_D1_WS_ENDPOINT=${{ matrix.prefix == 'ADMIN' && secrets.WEB_DEV_WS_ENDPOINT || '' }}
                  VITE_V1_WS_ENDPOINT=${{ matrix.prefix == 'ADMIN' && secrets.WEB_PROD_WS_ENDPOINT || '' }}
                  EOF
                  sed -i 's/^ *//' "$ENV_FILE"
                  grep -v '=$' "$ENV_FILE" > "$ENV_FILE.tmp" && mv "$ENV_FILE.tmp" "$ENV_FILE"
                  echo "Generated $ENV_FILE:"
                  cat "$ENV_FILE"

            - name: Deploy to PROD
              env:
                  WEB_S3_BUCKET: ${{ secrets.WEB_S3_BUCKET }}
                  WEB_CF_PROD_DISTRIBUTION_ID: ${{ secrets.WEB_CF_PROD_DISTRIBUTION_ID }}
                  DESKTOP_S3_BUCKET: ${{ secrets.DESKTOP_S3_BUCKET }}
                  DESKTOP_CF_PROD_DISTRIBUTION_ID: ${{ secrets.DESKTOP_CF_PROD_DISTRIBUTION_ID }}
                  BLOCK_KIT_BUILDER_S3_BUCKET: ${{ secrets.BLOCK_KIT_BUILDER_S3_BUCKET }}
                  BLOCK_KIT_BUILDER_CF_PROD_DISTRIBUTION_ID: ${{ secrets.BLOCK_KIT_BUILDER_CF_PROD_DISTRIBUTION_ID }}
                  ADMIN_S3_BUCKET: ${{ secrets.ADMIN_S3_BUCKET }}
                  ADMIN_CF_PROD_DISTRIBUTION_ID: ${{ secrets.ADMIN_CF_PROD_DISTRIBUTION_ID }}
                  LANDING_S3_DEV_BUCKET: ${{ secrets.LANDING_S3_DEV_BUCKET }}
                  LANDING_S3_PROD_BUCKET: ${{ secrets.LANDING_S3_PROD_BUCKET }}
                  LANDING_CF_PROD_DISTRIBUTION_ID: ${{ secrets.LANDING_CF_PROD_DISTRIBUTION_ID }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
                  VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_PROD_API_KEY }}
                  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_PROD_AUTH_DOMAIN }}
                  VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROD_PROJECT_ID }}
                  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_PROD_STORAGE_BUCKET }}
                  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_PROD_MESSAGING_SENDER_ID }}
                  VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_PROD_APP_ID }}
                  VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_PROD_MEASUREMENT_ID }}
              run: |
                  set -e
                  chmod +x scripts/deploy-${{ matrix.project }}.sh
                  yarn ${{ matrix.project }}:deploy:prod

            # PROD builds emit maps as 'hidden' — written, but with no
            # sourceMappingURL comment in the bundle — and the deploy scripts
            # exclude *.map from the S3 sync, so this run is the only place they
            # survive. Without it PROD emits maps and CI throws them away, which
            # is where an unreadable stack costs the most.
            #
            # `yarn trace` finds the right one by bundle hash: a stack frame
            # names `index-<hash>.js` and the artifact holding
            # `index-<hash>.js.map` is the matching build. See
            # libs/web-core/docs/error-reporting.md.
            - name: Archive source maps
              uses: actions/upload-artifact@v4
              with:
                  name: sourcemaps-${{ matrix.project }}-${{ github.sha }}
                  path: dist/apps/${{ matrix.project }}/**/*.map
                  # desktop-web still emits none; never fail a deploy over this.
                  if-no-files-found: warn
                  # 30 days was too short for what these are for. The reports
                  # that most need a map are the rare ones, and a rare crash is
                  # rarely triaged inside a month — past the window the stack is
                  # unreadable for good, since the map exists nowhere else.
                  # 90 is the cap for public repos; this one is private, so it
                  # can go to 400 if storage cost is acceptable.
                  retention-days: 90

    notify-dou:
        needs: [changes, get-version, build-and-deploy]
        if: ${{ success() && (needs.changes.outputs.web == 'true' || needs.changes.outputs.admin == 'true' || needs.changes.outputs.landing == 'true' || needs.changes.outputs.desktopweb == 'true' || needs.changes.outputs.blockkitbuilder == 'true') }}
        name: Notify DoU
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: release-drafter/release-drafter@v5
              id: release-drafted
              with:
                  publish: true
                  version: ${{ needs.get-version.outputs.root-version }}
                  tag: ${{ needs.get-version.outputs.root-version }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Prepare deploy message
              id: deploy-message
              run: |
                  set -e
                  DEPLOY_MESSAGES=()

                  if [[ "${{ needs.changes.outputs.web }}" == "true" ]]; then
                      DEPLOY_MESSAGES+=("• *웹* <https://dou.chatic.io/|PROD 서버> \`v${{ needs.get-version.outputs.web-version }}\`")
                  fi

                  if [[ "${{ needs.changes.outputs.admin }}" == "true" ]]; then
                      DEPLOY_MESSAGES+=("• *어드민* <https://admin.chatic.io/|PROD 서버> \`v${{ needs.get-version.outputs.admin-version }}\`")
                  fi

                  if [[ "${{ needs.changes.outputs.landing }}" == "true" ]]; then
                      DEPLOY_MESSAGES+=("• *랜딩* <https://app.chatic.io/|PROD 서버> \`v${{ needs.get-version.outputs.landing-version }}\`")
                  fi

                  if [[ "${{ needs.changes.outputs.desktopweb }}" == "true" ]]; then
                      DEPLOY_MESSAGES+=("• *데스크톱웹* <https://desktop.dou.chatic.io/|PROD 서버> \`v${{ needs.get-version.outputs.desktopweb-version }}\`")
                  fi

                  # No version suffix: the builder is not in version-update.js, so
                  # its package version never moves.
                  if [[ "${{ needs.changes.outputs.blockkitbuilder }}" == "true" ]]; then
                      DEPLOY_MESSAGES+=("• *블록킷 빌더* <https://block-kit.chatic.io/|PROD 서버>")
                  fi

                  if [ ${#DEPLOY_MESSAGES[@]} -eq 0 ]; then
                      DEPLOY_INFO="*PROD 환경 배포가 완료되었습니다.*"
                  else
                      DEPLOY_INFO=$(printf "%s\n" "${DEPLOY_MESSAGES[@]}")
                  fi

                  {
                    echo "deploy_info<<EOF"
                    echo -e "$DEPLOY_INFO"
                    echo "EOF"
                  } >> $GITHUB_OUTPUT || {
                    echo "deploy_info=⚠️ 배포 메시지 생성 실패" >> $GITHUB_OUTPUT
                  }

            - name: Notify DoU
              uses: lemoncloud-io/actions/notify-dou@v1
              with:
                  url: ${{ secrets.DOU_WEBHOOK_URL }}
                  token: ${{ secrets.DOU_WEBHOOK_TOKEN }}
                  channel-id: ${{ secrets.DOU_CHANNEL_ID }}
                  status: success
                  stage: prod
                  text: ${{ steps.deploy-message.outputs.deploy_info }}
                  release-notes: ${{ steps.release-drafted.outputs.body }}

    notify-dou-failure:
        needs: [changes, get-version, build-and-deploy]
        if: ${{ failure() && (needs.changes.outputs.web == 'true' || needs.changes.outputs.admin == 'true' || needs.changes.outputs.landing == 'true' || needs.changes.outputs.desktopweb == 'true') }}
        name: Notify DoU - Failure
        runs-on: ubuntu-latest
        steps:
            - name: Prepare deploy message
              id: deploy-message
              run: |
                  set -e
                  DEPLOY_MESSAGES=()

                  if [[ "${{ needs.changes.outputs.web }}" == "true" ]]; then
                      DEPLOY_MESSAGES+=("• *웹* PROD 서버")
                  fi

                  if [[ "${{ needs.changes.outputs.admin }}" == "true" ]]; then
                      DEPLOY_MESSAGES+=("• *어드민* PROD 서버")
                  fi

                  if [[ "${{ needs.changes.outputs.landing }}" == "true" ]]; then
                      DEPLOY_MESSAGES+=("• *랜딩* PROD 서버")
                  fi

                  if [[ "${{ needs.changes.outputs.desktopweb }}" == "true" ]]; then
                      DEPLOY_MESSAGES+=("• *데스크톱* PROD 서버")
                  fi

                  if [ ${#DEPLOY_MESSAGES[@]} -eq 0 ]; then
                      DEPLOY_INFO="*PROD 환경 배포 중 오류가 발생했습니다.*"
                  else
                      DEPLOY_INFO=$(printf "*배포 실패:*\n%s" "$(printf "%s\n" "${DEPLOY_MESSAGES[@]}")")
                  fi

                  {
                    echo "deploy_info<<EOF"
                    echo -e "$DEPLOY_INFO"
                    echo "EOF"
                  } >> $GITHUB_OUTPUT || {
                    echo "deploy_info=⚠️ 배포 메시지 생성 실패" >> $GITHUB_OUTPUT
                  }

            - name: Notify DoU - failure
              uses: lemoncloud-io/actions/notify-dou@v1
              with:
                  url: ${{ secrets.DOU_WEBHOOK_URL }}
                  token: ${{ secrets.DOU_WEBHOOK_TOKEN }}
                  channel-id: ${{ secrets.DOU_CHANNEL_ID }}
                  status: failure
                  stage: prod
                  text: ${{ steps.deploy-message.outputs.deploy_info }}
