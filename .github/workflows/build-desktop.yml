name: build-desktop

# Builds the Electron desktop installers for both platforms in one run:
# macOS .dmg (macos-latest) + Windows .exe (windows-latest). Unsigned / ad-hoc,
# internal distribution (ADR-0003). Manual trigger; pick dev or prod per run so
# the two environments stay managed separately.
on:
    workflow_dispatch:
        inputs:
            env:
                description: Target environment
                type: choice
                options:
                    - dev
                    - prod
                default: dev

# The desktop build never needs the mobile CocoaPods install that the root postinstall
# runs on macOS runners — skip it to save minutes and drop an unrelated failure surface.
env:
    SKIP_MOBILE_POD: '1'

jobs:
    build:
        name: Build ${{ matrix.platform }} (${{ inputs.env }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                      platform: mac
                      artifact: 'apps/desktop/release/*.dmg'
                    - os: windows-latest
                      platform: win
                      artifact: 'apps/desktop/release/*.exe'
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Package ${{ matrix.platform }} installer
              run: yarn workspace @chatic/desktop package:${{ matrix.platform }}:${{ inputs.env }}

            - name: Upload installer artifact
              uses: actions/upload-artifact@v4
              with:
                  name: chatic-desktop-${{ inputs.env }}-${{ matrix.platform }}
                  path: ${{ matrix.artifact }}
                  if-no-files-found: error

    notify-slack:
        name: Notify Slack
        needs: build
        if: ${{ always() }}
        runs-on: ubuntu-latest
        steps:
            - name: Prepare Slack message
              id: msg
              run: |
                  set -e
                  TIMESTAMP=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S')
                  COMMIT_SHA="${GITHUB_SHA:0:7}"
                  if [[ "${{ needs.build.result }}" == "success" ]]; then
                    echo "emoji=:desktop_computer:" >> $GITHUB_OUTPUT
                    echo "title=Chatic 데스크톱 빌드 완료 (${{ inputs.env }})" >> $GITHUB_OUTPUT
                    echo "body=• mac \`.dmg\` + win \`.exe\` 생성 — Actions Run의 Artifacts에서 다운로드" >> $GITHUB_OUTPUT
                  else
                    echo "emoji=:x:" >> $GITHUB_OUTPUT
                    echo "title=Chatic 데스크톱 빌드 실패 (${{ inputs.env }})" >> $GITHUB_OUTPUT
                    echo "body=• 빌드 결과: \`${{ needs.build.result }}\` — 로그 확인 필요" >> $GITHUB_OUTPUT
                  fi
                  echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
                  echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT

            - name: Post to Slack
              continue-on-error: true
              uses: slackapi/slack-github-action@v2.1.1
              with:
                  method: chat.postMessage
                  token: ${{ secrets.RELEASE_BOT_TOKEN }}
                  payload: |
                      channel: ${{ secrets.CHATIC_CHANNEL }}
                      text: 'Chatic 데스크톱 빌드 알림'
                      unfurl_links: false
                      unfurl_media: false
                      blocks: [
                          {
                              "type": "header",
                              "text": { "type": "plain_text", "text": "${{ steps.msg.outputs.emoji }} ${{ steps.msg.outputs.title }}" }
                          },
                          {
                              "type": "section",
                              "text": { "type": "mrkdwn", "text": ${{ toJSON(steps.msg.outputs.body) }} }
                          },
                          {
                              "type": "divider"
                          },
                          {
                              "type": "section",
                              "fields": [
                                  { "type": "mrkdwn", "text": "*빌드 시각:*\n${{ steps.msg.outputs.timestamp }}" },
                                  { "type": "mrkdwn", "text": "*커밋:*\n<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ steps.msg.outputs.commit_sha }}>" }
                              ]
                          },
                          {
                              "type": "context",
                              "elements": [
                                  { "type": "mrkdwn", "text": "by ${{ github.actor }} | <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Actions Run>" }
                              ]
                          }
                      ]
