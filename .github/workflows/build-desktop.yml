name: build-desktop

# Builds the Electron desktop installers for both platforms in one run:
# macOS .dmg (macos-latest) + Windows .exe (windows-latest). Unsigned / ad-hoc,
# internal distribution (ADR-0003). Manual trigger; pick dev or prod per run so
# the two environments stay managed separately. Installers are published to a
# rolling per-env GitHub Release (desktop-dev / desktop-prod) for easy download.
on:
    workflow_dispatch:
        inputs:
            env:
                description: Target environment
                type: choice
                options:
                    - dev
                    - prod
                default: dev
    # TEMP: verify CI macOS signing/notarization on a prod build. Remove after.
    push:
        branches:
            - feature/louis-update-electron

# The desktop build never needs the mobile CocoaPods install that the root postinstall
# runs on macOS runners — skip it to save minutes and drop an unrelated failure surface.
env:
    SKIP_MOBILE_POD: '1'

jobs:
    build:
        name: Build ${{ matrix.platform }} (${{ inputs.env || 'prod' }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                      platform: mac
                      artifact: 'apps/desktop/release/*.dmg'
                    - os: windows-latest
                      platform: win
                      artifact: 'apps/desktop/release/*.exe'
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'

            # node-gyp (better-sqlite3 falls back to source build when no prebuild is fetched)
            # needs distutils, removed from Python 3.12+. Pin 3.11 so the compile can succeed.
            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'

            - name: Install dependencies
              shell: bash
              run: |
                  for i in 1 2 3; do
                    yarn install --frozen-lockfile && exit 0
                    echo "install attempt $i failed (transient download?); retrying in 15s"
                    sleep 15
                  done
                  exit 1

            # macOS prod is Developer-ID signed + notarized when the signing secrets are present;
            # otherwise (dev, Windows, or secrets unset) the build stays unsigned / ad-hoc.
            - name: Package ${{ matrix.platform }} installer
              shell: bash
              env:
                  CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
                  CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
                  APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
                  APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
                  APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
              run: |
                  set -e
                  EXTRA=""
                  if [ "${{ matrix.platform }}" = "mac" ] && [ "${{ inputs.env || 'prod' }}" = "prod" ] && [ -n "$CSC_LINK" ]; then
                    if [ -n "$APPLE_API_KEY_B64" ]; then
                      echo "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"
                      export APPLE_API_KEY="$RUNNER_TEMP/apple_api_key.p8"
                      EXTRA="-c.mac.notarize=true"
                      echo "macOS prod: Developer ID signing + notarization enabled"
                    else
                      echo "macOS prod: signing only (no notarization credentials)"
                    fi
                  else
                    # Don't leak the macOS cert into Windows/dev builds — keep them ad-hoc/unsigned.
                    unset CSC_LINK CSC_KEY_PASSWORD
                  fi
                  yarn workspace @chatic/desktop package:${{ matrix.platform }}:${{ inputs.env || 'prod' }} $EXTRA

            # Artifact is the transport to the release job below (and a fallback download).
            - name: Upload installer artifact
              uses: actions/upload-artifact@v4
              with:
                  name: chatic-desktop-${{ inputs.env || 'prod' }}-${{ matrix.platform }}
                  path: ${{ matrix.artifact }}
                  if-no-files-found: error

    release:
        name: Publish GitHub Release
        needs: build
        if: ${{ needs.build.result == 'success' }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            url: ${{ steps.publish.outputs.url }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Download installers
              uses: actions/download-artifact@v4
              with:
                  path: dist

            - name: Publish rolling release
              id: publish
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: desktop-${{ inputs.env || 'prod' }}
              run: |
                  set -e
                  VERSION=$(node -p "require('./apps/desktop/package.json').version")
                  TITLE="Chatic Desktop (${{ inputs.env || 'prod' }}) v${VERSION}"
                  PRERELEASE=""
                  [ "${{ inputs.env || 'prod' }}" = "dev" ] && PRERELEASE="--prerelease"
                  # Rolling release per env: drop the previous one so the tag always points at the
                  # latest build and holds only the current installers (internal "grab latest").
                  gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
                  gh release create "$TAG" dist/*/*.dmg dist/*/*.exe \
                      --title "$TITLE" \
                      --target "$GITHUB_SHA" \
                      --notes "Unsigned internal build (\`${{ inputs.env || 'prod' }}\`). macOS \`.dmg\` + Windows \`.exe\`. Build ${{ github.run_number }}, commit \`${GITHUB_SHA:0:7}\`." \
                      $PRERELEASE
                  URL=$(gh release view "$TAG" --json url -q .url)
                  echo "url=${URL}" >> "$GITHUB_OUTPUT"

    notify-slack:
        name: Notify Slack
        needs: [build, release]
        # Only notify for real manual builds — never for push-triggered smoke tests.
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        runs-on: ubuntu-latest
        steps:
            - name: Prepare Slack message
              id: msg
              run: |
                  set -e
                  TIMESTAMP=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S')
                  COMMIT_SHA="${GITHUB_SHA:0:7}"
                  if [[ "${{ needs.release.result }}" == "success" ]]; then
                    echo "emoji=:desktop_computer:" >> "$GITHUB_OUTPUT"
                    echo "title=Chatic 데스크톱 빌드 완료 (${{ inputs.env || 'prod' }})" >> "$GITHUB_OUTPUT"
                    echo "body=• mac \`.dmg\` + win \`.exe\` → <${{ needs.release.outputs.url }}|GitHub Release에서 다운로드>" >> "$GITHUB_OUTPUT"
                  elif [[ "${{ needs.build.result }}" != "success" ]]; then
                    echo "emoji=:x:" >> "$GITHUB_OUTPUT"
                    echo "title=Chatic 데스크톱 빌드 실패 (${{ inputs.env || 'prod' }})" >> "$GITHUB_OUTPUT"
                    echo "body=• 빌드 결과: \`${{ needs.build.result }}\` — 로그 확인 필요" >> "$GITHUB_OUTPUT"
                  else
                    echo "emoji=:warning:" >> "$GITHUB_OUTPUT"
                    echo "title=Chatic 데스크톱 릴리즈 실패 (${{ inputs.env || 'prod' }})" >> "$GITHUB_OUTPUT"
                    echo "body=• 빌드는 성공했으나 릴리즈 단계 실패 — 로그 확인 필요" >> "$GITHUB_OUTPUT"
                  fi
                  echo "timestamp=${TIMESTAMP}" >> "$GITHUB_OUTPUT"
                  echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

            - name: Post to Slack
              continue-on-error: true
              uses: slackapi/slack-github-action@v2.1.1
              with:
                  method: chat.postMessage
                  token: ${{ secrets.RELEASE_BOT_TOKEN }}
                  payload: |
                      channel: ${{ secrets.CHATIC_CHANNEL }}
                      text: 'Chatic 데스크톱 빌드 알림'
                      unfurl_links: false
                      unfurl_media: false
                      blocks: [
                          {
                              "type": "header",
                              "text": { "type": "plain_text", "text": "${{ steps.msg.outputs.emoji }} ${{ steps.msg.outputs.title }}" }
                          },
                          {
                              "type": "section",
                              "text": { "type": "mrkdwn", "text": ${{ toJSON(steps.msg.outputs.body) }} }
                          },
                          {
                              "type": "divider"
                          },
                          {
                              "type": "section",
                              "fields": [
                                  { "type": "mrkdwn", "text": "*빌드 시각:*\n${{ steps.msg.outputs.timestamp }}" },
                                  { "type": "mrkdwn", "text": "*커밋:*\n<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ steps.msg.outputs.commit_sha }}>" }
                              ]
                          },
                          {
                              "type": "context",
                              "elements": [
                                  { "type": "mrkdwn", "text": "by ${{ github.actor }} | <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Actions Run>" }
                              ]
                          }
                      ]
