name: verify

# The repo had no verification workflow. The other five build and deploy, `lint-staged` runs eslint
# on staged files, and nothing else ran — so a type error or a failing test surfaced only when
# somebody happened to run the command locally, and a fair amount of both accumulated unseen.
#
# What this gate covers is what passes today, listed explicitly. The projects left out are named at
# the bottom with the reason, so shrinking that list is a visible piece of work rather than a
# forgotten one.

on:
    pull_request:
    push:
        branches:
            - develop

# Read-only by default; the `base` job adds `actions: read` for its lookup.
permissions:
    contents: read

concurrency:
    group: verify-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # The commit both jobs below compare against, resolved once so they cannot disagree.
    #
    # A pull request is compared with its base branch. A push to develop is compared with the
    # commit the last successful push run on develop checked, not with the commit just before it:
    # a run cancelled by the next merge, or a red one, would otherwise drop its commits out of
    # every later comparison, and a merge that touches some other project would turn develop green
    # while the broken one is still broken.
    #
    # Empty when there is nothing trustworthy to compare with — no successful run yet, a failed
    # lookup, a base that is not an ancestor of HEAD after a rewritten history — and both jobs then
    # check everything rather than guess.
    base:
        name: resolve the compare base
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
        outputs:
            sha: ${{ steps.base.outputs.sha }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Resolve
              id: base
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
              run: |
                  if [ -n "$PR_BASE" ]; then
                      base=$(git rev-parse --verify --quiet "$PR_BASE^{commit}") || base=''
                  else
                      base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/runs?branch=develop&event=push&status=success&per_page=1" \
                          --jq '.workflow_runs[0].head_sha // empty') || base=''
                      if [ -n "$base" ] && ! git merge-base --is-ancestor "$base" HEAD 2>/dev/null; then
                          base=''
                      fi
                  fi
                  echo "sha=$base" >> "$GITHUB_OUTPUT"

    verify:
        needs: base
        name: doc links · doc language · code comment language · lint · typecheck · test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  # `nx affected` compares against the base commit, so it needs history.
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'

            - name: Get Yarn cache path
              id: yarn-cache-dir-path
              run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

            - name: Cache dependencies
              id: cache-dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ steps.yarn-cache-dir-path.outputs.dir }}
                      node_modules
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Install dependencies
              if: ${{ steps.cache-dependencies.outputs.cache-hit != 'true' }}
              run: yarn install --frozen-lockfile

            # Lint, typecheck and test below run for the projects this change reaches, not for all
            # of them. The gate runs twice per change — on the pull request and again on the push
            # its merge makes to develop — and before this both runs checked every project, so a
            # one-file change paid for the whole workspace twice, test the largest share of it.
            #
            # The base comes from the `base` job above; it says what is compared with and why.
            #
            # `nx affected` follows project files and their dependents, plus the root files Nx
            # itself understands (nx.json, package.json, the lockfile, tsconfig.base.json). A root
            # file it does not map to a project — a shared eslint, jest or vitest config, a script a
            # target calls, this workflow — would select nothing, so any changed file outside
            # `apps/` and `libs/` that is not markdown runs every project instead, and so does an
            # empty base. `--no-renames` matches how Nx lists changed files, so a root config moved
            # under `apps/` still shows its old path here.
            #
            # `changed=` on a line of its own, so a failing `git diff` fails this step instead of
            # reading as "nothing changed".
            - name: Which projects to check
              id: scope
              env:
                  BASE: ${{ needs.base.outputs.sha }}
              run: |
                  if [ -z "$BASE" ]; then
                      echo "nx=run-many" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  changed=$(git diff --name-only --no-renames "$BASE"...HEAD)
                  if grep -vE '^(apps|libs)/|\.md$' <<<"$changed" | grep -q .; then
                      echo "nx=run-many" >> "$GITHUB_OUTPUT"
                  else
                      echo "nx=affected --base=$BASE --head=HEAD" >> "$GITHUB_OUTPUT"
                  fi

            # Documents are the one artifact no other step reads. Cheap, needs no build, and green
            # across every tracked markdown file, so it runs first and fails fast.
            - name: Doc links
              run: yarn check:doc-links

            # AGENTS.md's English policy, for the one surface nothing else in this file can see.
            - name: Doc language
              run: yarn check:doc-korean

            # Same policy, for code comments — the repo-wide translation sweep that unblocked this
            # gate is done, so it now runs alongside the doc-language check above.
            - name: Code comment language
              run: yarn check:code-korean

            # AGENTS.md's public-surface rule, for internal document paths left in comments and docs.
            - name: Internal paths
              run: yarn check:internal-paths

            # Green across every project, so no exclusions here.
            - name: Lint
              env:
                  NX_SCOPE: ${{ steps.scope.outputs.nx }}
              # Unquoted on purpose, so the scope splits into words.
              run: npx nx $NX_SCOPE -t lint

            # `--exclude` and not an allowlist: a project's dependencies are typechecked whether or
            # not they are selected, so excluding the red ones only works while nothing green
            # depends on them. That is why a project can be clean on its own and still have to sit
            # on this list until whatever it pulls goes green — which is how `web` came off it.
            - name: Typecheck
              env:
                  NX_SCOPE: ${{ steps.scope.outputs.nx }}
              run: >
                  npx nx $NX_SCOPE -t typecheck
                  --exclude=block-kit-builder,@chatic/mobile,chatic-deferred-link-cleanup

            # `libs/db` and `libs/app-runtime` ran through a separate step until the root
            # `workspaces` array was fixed to `libs/*` — it still named `libs/bridge` and
            # `libs/socket`, neither of which exists, so nx inferred no `test` target for them and
            # `run-many` skipped them silently. They are covered by the line below now, and so is
            # `@chatic/bridges`, whose `yarn test` could not resolve jest for the same reason.
            - name: Test
              env:
                  NX_SCOPE: ${{ steps.scope.outputs.nx }}
              run: npx nx $NX_SCOPE -t test

            # Left out of the gate, with the reason. Measured 2026-09-14 (dated per row where a row was re-measured).
            #
            #   typecheck   @chatic/mobile               red
            #               block-kit-builder            red
            #               chatic-deferred-link-cleanup red
            #
            #   `landing` left both the TYPECHECK and the TEST list on 2026-10-23, and nothing was traded
            #   away for it. Its 32 type errors were fixed, not silenced: 29 were the global `JSX`
            #   namespace React 19 removed (now imported from 'react'), one sat in a component nothing
            #   used (deleted), and two were locale JSON files missing from the include. tsconfig.json
            #   references a spec project too, so the tests are type checked as well as run. All of its
            #   tests pass, measured the same day; what was missing was a gate that ran them.
            #
            #   `desktop-web` left the TYPECHECK list on 2026-10-06, and nothing was traded away for it:
            #   its errors (21 when first counted) are gone, measured 0 from a clean build of every lib
            #   (`rm -rf libs/*/dist libs/*/out-tsc apps/desktop-web/out-tsc`, then `tsc -b` and
            #   `nx run desktop-web:typecheck`). They were fixed, not silenced.
            #
            #   `web` left the TEST list on 2026-09-17, and nothing was traded away for it either:
            #   the 7 failures were three stale test files, not product bugs. Two had been left
            #   behind by a decision (the profile write names its place instead of reading it off the
            #   ambient data context) and one by `syncProfiles` gaining a required `siteId`. All
            #   2721 now pass; no case is skipped or isolated. The step takes longer for it, which
            #   is the trade: a test that does not run is not a test.
            #
            #   @chatic/web-ui-kit and web both left the TYPECHECK list on 2026-09-14, and nothing was
            #   traded away for it: the 3 story errors were fixed, so tsconfig.json references
            #   lib, spec AND storybook. Source, tests and stories are all type checked.
            #   (`web` was only ever excluded because its target pulls web-ui-kit.)
            #
            #   test        (none)

    # `apps/web` in its native (WebView) mode, driven in Chromium and WebKit against a fake native
    # shell and a fake relay (`apps/web-e2e`). A job of its own so it runs beside the gate above
    # rather than after it.
    #
    # One job per browser project, so the two halves of the suite run side by side instead of
    # sharing two workers in one job.
    #
    # Inside Playwright's own image, because the browsers' system libraries are already in it.
    # Installing them on the runner (`playwright install --with-deps`) went through the runner's apt
    # mirror, which usually took under a minute but in a quarter of the runs measured took 7 to 17,
    # at about 140 kB/s. The image tag has to name the same version as `@playwright/test` in
    # yarn.lock; the first step below fails with both versions when they drift apart.
    #
    # Skipped when `web-e2e` is not affected — the web app, the libs it builds from and the e2e
    # project itself are what move it — and the mobile injection script it loads is unchanged.
    e2e:
        needs: base
        name: web e2e · ${{ matrix.project }}
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.64.0-noble
        strategy:
            fail-fast: false
            matrix:
                project: [webkit-ios, chromium-android]
        steps:
            - uses: actions/checkout@v4
              with:
                  # `nx show projects --affected` compares against the base commit, so it needs history.
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'

            - name: Get Yarn cache path
              id: yarn-cache-dir-path
              run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

            # A key of its own: node_modules installed in this image is not the runner's, and the
            # two must not overwrite each other.
            - name: Cache dependencies
              id: cache-dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ steps.yarn-cache-dir-path.outputs.dir }}
                      node_modules
                  key: ${{ runner.os }}-playwright-image-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-playwright-image-yarn-

            - name: Install dependencies
              if: ${{ steps.cache-dependencies.outputs.cache-hit != 'true' }}
              run: yarn install --frozen-lockfile

            - name: Image matches @playwright/test
              run: |
                  image=$(node -p "require('/ms-playwright-agent/node_modules/playwright-core/package.json').version")
                  installed=$(node -p "require('@playwright/test/package.json').version")
                  if [ "$image" != "$installed" ]; then
                      echo "::error::The e2e container image is Playwright $image but yarn.lock installs $installed. Update the image tag in verify.yml."
                      exit 1
                  fi

            # The mobile app's injection script counts too: the fake shell loads it by path, so no
            # dependency edge makes `web-e2e` affected by it (apps/web-e2e/README.md § The shell).
            # So does this workflow: nx maps it to no project, and a change to this job (the image
            # tag, the matrix) has to be seen running the suite before it merges.
            # `projects=` on a line of its own, so a failing `nx` fails this step instead of reading as
            # "not affected". An empty base runs the suite rather than guess.
            - name: Is web-e2e affected
              id: affected
              env:
                  BASE: ${{ needs.base.outputs.sha }}
              run: |
                  # The checkout is owned by the runner's user, not this container's root.
                  git config --global --add safe.directory "$GITHUB_WORKSPACE"
                  if [ -z "$BASE" ]; then
                      echo "run=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  projects=$(npx nx show projects --affected --base="$BASE" --head=HEAD)
                  changed=$(git diff --name-only --no-renames "$BASE"...HEAD)
                  if grep -qx 'web-e2e' <<<"$projects" \
                      || grep -qx 'apps/mobile/src/app/webview/utils/injectionScripts.ts' <<<"$changed" \
                      || grep -qx '.github/workflows/verify.yml' <<<"$changed"; then
                      echo "run=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "run=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: E2E
              if: ${{ steps.affected.outputs.run == 'true' }}
              env:
                  PROJECT: ${{ matrix.project }}
              # After `--`, so nx hands it to Playwright instead of reading it as an nx project.
              run: npx nx run web-e2e:e2e -- --project="$PROJECT"

            - name: Upload the report
              if: ${{ failure() && steps.affected.outputs.run == 'true' }}
              uses: actions/upload-artifact@v4
              with:
                  name: web-e2e-report-${{ matrix.project }}
                  path: dist/.playwright/apps/web-e2e
                  retention-days: 14
