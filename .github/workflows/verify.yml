name: verify

# The repo had no verification workflow. The other five build and deploy, `lint-staged` runs eslint
# on staged files, and nothing else ran — so a type error or a failing test surfaced only when
# somebody happened to run the command locally, and a fair amount of both accumulated unseen.
#
# What this gate covers is what passes today, listed explicitly. The projects left out are named at
# the bottom with the reason, so shrinking that list is a visible piece of work rather than a
# forgotten one.

on:
    pull_request:
    push:
        branches:
            - develop
    # Hands develop a ratchet judge newer than its compare base — tools/eslint-rules/README.md
    # § Who judges a change.
    workflow_dispatch:
        inputs:
            judge:
                description: 'A develop commit whose ratchet scripts, modes and baselines judge this run'
                required: true
                type: string

# Read-only by default; the `base` job adds `actions: read` for its lookup.
permissions:
    contents: read

# A manual run gets a group of its own, so the next merge to develop cannot cancel it.
concurrency:
    group: verify-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && '-manual' || '' }}
    cancel-in-progress: true

jobs:
    # The commit both jobs below compare against, resolved once so they cannot disagree.
    #
    # A pull request is compared with its base branch. A push to develop is compared with the
    # commit the last successful push or manual run on develop checked, not with the commit just before it:
    # a run cancelled by the next merge, or a red one, would otherwise drop its commits out of
    # every later comparison, and a merge that touches some other project would turn develop green
    # while the broken one is still broken.
    #
    # Empty when there is nothing trustworthy to compare with — no successful run yet, a failed
    # lookup, a base that is not an ancestor of HEAD after a rewritten history — and both jobs then
    # check everything rather than guess.
    #
    # `judge` is the commit the ratchet steps take their judge and baselines from. A pull request
    # takes its base; a push takes the develop tip before the push (`github.event.before`), never a
    # commit of the push itself — not the last green run, whose old scripts and long rename range
    # misjudge every merge since. A manual run takes its `judge` input, which must be a
    # commit on develop's first-parent line (a merge or a direct push, never a commit inside a merged
    # branch), no older than the compare base, and carry the ratchet. Lint, typecheck and test still
    # cover everything since the compare base.
    #
    # `walk_from` is where the step-by-step baseline check starts: the compare base, or in a manual
    # run the `judge` input, so a maintainer can step past a raise that would otherwise keep every
    # later run red.
    base:
        name: resolve the compare base
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
        outputs:
            sha: ${{ steps.base.outputs.sha }}
            judge: ${{ steps.base.outputs.judge }}
            walk_from: ${{ steps.base.outputs.walk_from }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Resolve
              id: base
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
                  JUDGE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.judge || '' }}
                  BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
              run: |
                  if [ -n "$PR_BASE" ]; then
                      base=$(git rev-parse --verify --quiet "$PR_BASE^{commit}") || base=''
                  else
                      base=$(for event in push workflow_dispatch; do
                          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/runs?branch=develop&event=$event&status=success&per_page=1" \
                              --jq '.workflow_runs[0] | select(.) | "\(.created_at) \(.head_sha)"' || echo failed
                      done | sort -r | head -n 1 | cut -d' ' -f2)
                      case "$base" in *failed* | '') base='' ;; esac
                      if [ -n "$base" ] && ! git merge-base --is-ancestor "$base" HEAD 2>/dev/null; then
                          base=''
                      fi
                  fi
                  judge=$base
                  walk_from=$base
                  if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$BEFORE" ] &&
                      git cat-file -e "$BEFORE^{commit}" 2>/dev/null &&
                      git merge-base --is-ancestor "$BEFORE" HEAD && [ "$BEFORE" != "$(git rev-parse HEAD)" ]; then
                      judge=$BEFORE
                  fi
                  if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
                      if [ "$GITHUB_REF" != refs/heads/develop ]; then
                          echo "::error title=ratchet::a manual run judges develop only, not $GITHUB_REF"
                          exit 1
                      fi
                      shown=${JUDGE_INPUT//[^0-9A-Za-z._\/-]/?}
                      judge=$(git rev-parse --verify --quiet "$JUDGE_INPUT^{commit}") || judge=''
                      if [ -z "$judge" ] || ! git rev-list --first-parent HEAD | grep -x "$judge" >/dev/null; then
                          echo "::error title=ratchet::judge '$shown' is not a commit on develop's first-parent line"
                          exit 1
                      fi
                      if [ -n "$base" ] && ! git merge-base --is-ancestor "$base" "$judge"; then
                          echo "::error title=ratchet::judge $judge is older than the compare base $base"
                          exit 1
                      fi
                      if ! git cat-file -e "$judge:scripts/ratchet.js" 2>/dev/null; then
                          echo "::error title=ratchet::judge $judge carries no ratchet"
                          exit 1
                      fi
                      echo "::notice title=ratchet::compare base ${base:-none}; ratchet judge $judge, chosen by $GITHUB_ACTOR"
                      walk_from=$judge
                  fi
                  echo "sha=$base" >> "$GITHUB_OUTPUT"
                  echo "judge=$judge" >> "$GITHUB_OUTPUT"
                  echo "walk_from=$walk_from" >> "$GITHUB_OUTPUT"

    verify:
        needs: base
        name: doc links · doc language · code comment language · ratchets · lint · typecheck · test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  # `nx affected` compares against the base commit, so it needs history.
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'

            - name: Get Yarn cache path
              id: yarn-cache-dir-path
              run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

            - name: Cache dependencies
              id: cache-dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ steps.yarn-cache-dir-path.outputs.dir }}
                      node_modules
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Install dependencies
              if: ${{ steps.cache-dependencies.outputs.cache-hit != 'true' }}
              run: yarn install --frozen-lockfile

            # Lint, typecheck and test below run for the projects this change reaches, not for all
            # of them. The gate runs twice per change — on the pull request and again on the push
            # its merge makes to develop — and before this both runs checked every project, so a
            # one-file change paid for the whole workspace twice, test the largest share of it.
            #
            # The base comes from the `base` job above; it says what is compared with and why.
            #
            # `nx affected` follows project files and their dependents, plus the root files Nx
            # itself understands (nx.json, package.json, the lockfile, tsconfig.base.json). A root
            # file it does not map to a project — a shared eslint, jest or vitest config, a script a
            # target calls, this workflow — would select nothing, so any changed file outside
            # `apps/` and `libs/` that is not markdown runs every project instead, and so does an
            # empty base. `--no-renames` matches how Nx lists changed files, so a root config moved
            # under `apps/` still shows its old path here.
            #
            # The rule lives in `scripts/gate.js scope`, which `yarn gate` uses too, so a local run
            # and CI pick the same projects. `scope=` on a line of its own, so a failing script fails
            # this step instead of reading as "nothing changed".
            - name: Which projects to check
              id: scope
              env:
                  BASE: ${{ needs.base.outputs.sha }}
              run: |
                  if [ -z "$BASE" ]; then
                      echo "nx=run-many" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  scope=$(node scripts/gate.js scope --base "$BASE")
                  echo "nx=$scope" >> "$GITHUB_OUTPUT"

            # Every check below runs even when an earlier one failed (`!cancelled()`), so one red step
            # never hides the others' results; each waits only for the scope.
            #
            # Documents are the one artifact no other step reads. Cheap, needs no build, and green
            # across every tracked markdown file, so it runs first and fails fast.
            - name: Doc links
              if: ${{ !cancelled() && steps.scope.outcome == 'success' }}
              run: yarn check:doc-links

            # AGENTS.md's English policy, for the one surface nothing else in this file can see.
            - name: Doc language
              if: ${{ !cancelled() && steps.scope.outcome == 'success' }}
              run: yarn check:doc-korean

            # Same policy, for code comments — the repo-wide translation sweep that unblocked this
            # gate is done, so it now runs alongside the doc-language check above.
            - name: Code comment language
              if: ${{ !cancelled() && steps.scope.outcome == 'success' }}
              run: yarn check:code-korean

            # AGENTS.md's public-surface rule, for internal document paths left in comments and docs.
            - name: Internal paths
              if: ${{ !cancelled() && steps.scope.outcome == 'success' }}
              run: yarn check:internal-paths

            # The repository scripts' own tests (scripts/__tests__), which no Nx project runs.
            - name: Script tests
              if: ${{ !cancelled() && steps.scope.outcome == 'success' }}
              run: npx jest --config scripts/jest.config.js

            # Green across every project, so no exclusions here.
            - name: Lint
              if: ${{ !cancelled() && steps.scope.outcome == 'success' }}
              env:
                  NX_SCOPE: ${{ steps.scope.outputs.nx }}
              # Unquoted on purpose, so the scope splits into words.
              run: npx nx $NX_SCOPE -t lint

            # `--exclude` and not an allowlist: a project's dependencies are typechecked whether or
            # not they are selected, so excluding the red ones only works while nothing green
            # depends on them. That is why a project can be clean on its own and still have to sit
            # on this list until whatever it pulls goes green — which is how `web` came off it.
            - name: Typecheck
              if: ${{ !cancelled() && steps.scope.outcome == 'success' }}
              env:
                  NX_SCOPE: ${{ steps.scope.outputs.nx }}
              run: >
                  npx nx $NX_SCOPE -t typecheck
                  --exclude=block-kit-builder,@chatic/mobile,chatic-deferred-link-cleanup

            # `libs/db` and the runtime package (then `libs/app-runtime`, now `libs/runtime`) ran
            # through a separate step until the root
            # `workspaces` array was fixed to `libs/*` — it still named `libs/bridge` and
            # `libs/socket`, neither of which exists, so nx inferred no `test` target for them and
            # `run-many` skipped them silently. They are covered by the line below now, and so is
            # `@chatic/bridges`, whose `yarn test` could not resolve jest for the same reason.
            - name: Test
              if: ${{ !cancelled() && steps.scope.outcome == 'success' }}
              env:
                  NX_SCOPE: ${{ steps.scope.outputs.nx }}
              run: npx nx $NX_SCOPE -t test

            # Per-file ratchets: comment lines, escape hatches and useEffect calls, unused code
            # (knip) and copy-paste (jscpd) — tools/eslint-rules/README.md § Ratchet. They run after
            # the steps above, and even when one of those failed, so a forgotten `yarn ratchet:update`
            # never hides a lint or test result.
            #
            # A change must not be judged by rules it can edit. The judge — the scripts, the counting
            # module, the modes in scripts/ratchet/modes.json — is checked out from the compare base,
            # and the counts this tree may not exceed are the base's baselines (followed through
            # renames), so a change that loosens a check or raises a baseline is still judged by the
            # old one. Until the base carries the ratchet, this tree judges itself. A push takes the
            # judge from the develop tip before it and a manual run from its `judge` input (the `base` job).
            - name: Ratchet judge from the compare base
              id: judge
              if: ${{ !cancelled() }}
              env:
                  BASE: ${{ needs.base.outputs.judge }}
              run: |
                  if [ -n "$BASE" ] && git cat-file -e "$BASE:scripts/ratchet.js" 2>/dev/null; then
                      git worktree add --detach "$RUNNER_TEMP/ratchet-judge" "$BASE"
                      echo "dir=$RUNNER_TEMP/ratchet-judge" >> "$GITHUB_OUTPUT"
                  else
                      echo "::notice title=ratchet::the judge commit has no ratchet yet; this tree judges itself"
                      echo "dir=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
                  fi

            # One first-parent step at a time, from `walk_from` to HEAD: each step's baselines against
            # its parent, judged by the parent's ratchet scripts when the parent is in the judge's
            # history, by the judge otherwise, so no step judges itself. Over one
            # long range `git diff -M` can pair a moved file with the wrong half of a split and read
            # an unchanged entry as raised. A parent without `--head` is judged by the run's judge, and
            # a judge without `--head` compares once, with the judge commit.
            - name: Ratchet baselines only go down
              if: ${{ !cancelled() && steps.judge.outcome == 'success' && needs.base.outputs.judge != '' }}
              env:
                  BASE: ${{ needs.base.outputs.judge }}
                  WALK_FROM: ${{ needs.base.outputs.walk_from }}
                  JUDGE: ${{ steps.judge.outputs.dir }}
                  RATCHET_ROOT: ${{ github.workspace }}
              run: |
                  if ! grep -q "'--head'" "$JUDGE/scripts/ratchet.js"; then
                      node "$JUDGE/scripts/ratchet.js" verify-baseline --base "$BASE"
                      exit
                  fi
                  steps=$(git rev-list --first-parent --reverse "${WALK_FROM:-HEAD^1}..HEAD")
                  failed=0
                  for step in $steps; do
                      judge=$JUDGE
                      dir="$RUNNER_TEMP/ratchet-step"
                      rm -rf "$dir" && mkdir -p "$dir"
                      if git merge-base --is-ancestor "$step^1" "$BASE" &&
                          git cat-file -e "$step^1:scripts/ratchet.js" 2>/dev/null &&
                          git show "$step^1:scripts/ratchet.js" | grep "'--head'" >/dev/null; then
                          if git archive "$step^1" scripts/ratchet.js scripts/ratchet tools/eslint-rules | tar -x -C "$dir"; then
                              judge=$dir
                          else
                              echo "::notice title=ratchet::could not extract the judge of ${step:0:9}^1; the run's judge checks this step"
                          fi
                      fi
                      node "$judge/scripts/ratchet.js" verify-baseline --base "$step^1" --head "$step" || failed=1
                  done
                  exit $failed

            - name: Ratchet · comments, escape hatches, useEffect
              if: ${{ !cancelled() && steps.judge.outcome == 'success' }}
              env:
                  BASE: ${{ needs.base.outputs.judge }}
                  JUDGE: ${{ steps.judge.outputs.dir }}
                  RATCHET_ROOT: ${{ github.workspace }}
              run: node "$JUDGE/scripts/ratchet.js" check --only source ${BASE:+--reference "$BASE"}

            - name: Ratchet · unused code (knip)
              if: ${{ !cancelled() && steps.judge.outcome == 'success' }}
              env:
                  BASE: ${{ needs.base.outputs.judge }}
                  JUDGE: ${{ steps.judge.outputs.dir }}
                  RATCHET_ROOT: ${{ github.workspace }}
              run: node "$JUDGE/scripts/ratchet.js" check --only knip ${BASE:+--reference "$BASE"}

            - name: Ratchet · copy-paste (jscpd)
              if: ${{ !cancelled() && steps.judge.outcome == 'success' }}
              env:
                  BASE: ${{ needs.base.outputs.judge }}
                  JUDGE: ${{ steps.judge.outputs.dir }}
                  RATCHET_ROOT: ${{ github.workspace }}
              run: node "$JUDGE/scripts/ratchet.js" check --only jscpd ${BASE:+--reference "$BASE"}

            # Test files no `tsc -b` of their project reaches, per project (a spec tsconfig that
            # shares the app's build info is skipped as "up to date"). A judge from before this
            # check existed does not know it, so this tree judges itself until the base carries it.
            - name: Ratchet · test files outside every typecheck
              if: ${{ !cancelled() && steps.judge.outcome == 'success' }}
              env:
                  BASE: ${{ needs.base.outputs.judge }}
                  JUDGE: ${{ steps.judge.outputs.dir }}
                  RATCHET_ROOT: ${{ github.workspace }}
              run: |
                  if ! grep -q '"testTypecheck"' "$JUDGE/scripts/ratchet/modes.json"; then
                      echo "::notice title=ratchet::the compare base has no test typecheck ratchet yet; this tree judges itself"
                      JUDGE="$GITHUB_WORKSPACE"
                  fi
                  node "$JUDGE/scripts/ratchet.js" check --only testTypecheck ${BASE:+--reference "$BASE"}

            # Left out of the gate, with the reason. Measured 2026-09-14 (dated per row where a row was re-measured).
            #
            #   typecheck   @chatic/mobile               red
            #               block-kit-builder            red
            #               chatic-deferred-link-cleanup red
            #
            #   `landing` left both the TYPECHECK and the TEST list on 2026-10-23, and nothing was traded
            #   away for it. Its 32 type errors were fixed, not silenced: 29 were the global `JSX`
            #   namespace React 19 removed (now imported from 'react'), one sat in a component nothing
            #   used (deleted), and two were locale JSON files missing from the include. tsconfig.json
            #   references a spec project too, so the tests are type checked as well as run. All of its
            #   tests pass, measured the same day; what was missing was a gate that ran them.
            #
            #   `desktop-web` left the TYPECHECK list on 2026-10-06, and nothing was traded away for it:
            #   its errors (21 when first counted) are gone, measured 0 from a clean build of every lib
            #   (`rm -rf libs/*/dist libs/*/out-tsc apps/desktop-web/out-tsc`, then `tsc -b` and
            #   `nx run desktop-web:typecheck`). They were fixed, not silenced.
            #
            #   `web` left the TEST list on 2026-09-17, and nothing was traded away for it either:
            #   the 7 failures were three stale test files, not product bugs. Two had been left
            #   behind by a decision (the profile write names its place instead of reading it off the
            #   ambient data context) and one by `syncProfiles` gaining a required `siteId`. All
            #   2721 now pass; no case is skipped or isolated. The step takes longer for it, which
            #   is the trade: a test that does not run is not a test.
            #
            #   @chatic/web-ui-kit and web both left the TYPECHECK list on 2026-09-14, and nothing was
            #   traded away for it: the 3 story errors were fixed, so tsconfig.json references
            #   lib, spec AND storybook. Source, tests and stories are all type checked.
            #   (`web` was only ever excluded because its target pulls web-ui-kit.)
            #
            #   test        (none)

    # `apps/web` in its native (WebView) mode, driven in Chromium and WebKit against a fake native
    # shell and a fake relay (`apps/web-e2e`). A job of its own so it runs beside the gate above
    # rather than after it.
    #
    # One job per browser project, so the two halves of the suite run side by side instead of
    # sharing two workers in one job.
    #
    # Inside Playwright's own image, because the browsers' system libraries are already in it.
    # Installing them on the runner (`playwright install --with-deps`) went through the runner's apt
    # mirror, which usually took under a minute but in a quarter of the runs measured took 7 to 17,
    # at about 140 kB/s. The image tag has to name the same version as `@playwright/test` in
    # yarn.lock; the first step below fails with both versions when they drift apart.
    #
    # Skipped when `web-e2e` is not affected — the web app, the libs it builds from and the e2e
    # project itself are what move it — and the mobile injection script it loads is unchanged.
    #
    # The `visual` entry runs the `@visual` scenarios of both platforms against their Linux
    # baselines. It is a signal, not a gate: a visual change is often the point of a pull request,
    # so its job stays green and the verdict goes out as the commit status
    # `web-e2e/visual-regression` (apps/web-e2e/README.md § Visual regression). Every entry uploads
    # its evidence folder, whatever the result, for the `e2e-results` job below.
    e2e:
        needs: base
        name: web e2e · ${{ matrix.project }}
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.64.0-noble
        permissions:
            contents: read
            statuses: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - project: webkit-ios
                      target: e2e
                    - project: chromium-android
                      target: e2e
                      coverage: true
                    - project: visual
                      target: e2e-visual
                      visual: true
        # A container job runs `run:` steps with `sh` unless told otherwise, and the steps below use
        # bash (`<<<`).
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v4
              with:
                  # `nx show projects --affected` compares against the base commit, so it needs history.
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'

            - name: Get Yarn cache path
              id: yarn-cache-dir-path
              run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

            # A key of its own: node_modules installed in this image is not the runner's, and the
            # two must not overwrite each other.
            - name: Cache dependencies
              id: cache-dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ steps.yarn-cache-dir-path.outputs.dir }}
                      node_modules
                  key: ${{ runner.os }}-playwright-image-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-playwright-image-yarn-

            - name: Install dependencies
              if: ${{ steps.cache-dependencies.outputs.cache-hit != 'true' }}
              run: yarn install --frozen-lockfile

            # The image's own Playwright package is deleted when the image is built, so the check
            # asks the installed `@playwright/test` where it expects each browser and looks for
            # those folders under the image's PLAYWRIGHT_BROWSERS_PATH. A browser revision that is
            # not there means the tag and yarn.lock name different Playwright versions.
            - name: Image matches @playwright/test
              run: |
                  missing=$(npx playwright install --dry-run chromium webkit \
                      | sed -n 's/^ *Install location: *//p' \
                      | while read -r dir; do [ -d "$dir" ] || echo "$dir"; done)
                  if [ -n "$missing" ]; then
                      installed=$(node -p "require('@playwright/test/package.json').version")
                      echo "::error::yarn.lock installs Playwright $installed, but the e2e container image lacks its browsers ($(echo $missing)). Set the image tag in verify.yml to v$installed."
                      exit 1
                  fi

            # The mobile app's injection script counts too: the fake shell loads it by path, so no
            # dependency edge makes `web-e2e` affected by it (apps/web-e2e/README.md § The shell).
            # So does this workflow: nx maps it to no project, and a change to this job (the image
            # tag, the matrix) has to be seen running the suite before it merges.
            # `projects=` on a line of its own, so a failing `nx` fails this step instead of reading as
            # "not affected". An empty base runs the suite rather than guess.
            - name: Is web-e2e affected
              id: affected
              env:
                  BASE: ${{ needs.base.outputs.sha }}
              run: |
                  # The checkout is owned by the runner's user, not this container's root.
                  git config --global --add safe.directory "$GITHUB_WORKSPACE"
                  if [ -z "$BASE" ]; then
                      echo "run=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  projects=$(npx nx show projects --affected --base="$BASE" --head=HEAD)
                  changed=$(git diff --name-only --no-renames "$BASE"...HEAD)
                  if grep -qx 'web-e2e' <<<"$projects" \
                      || grep -qx 'apps/mobile/src/app/webview/utils/injectionScripts.ts' <<<"$changed" \
                      || grep -qx '.github/workflows/verify.yml' <<<"$changed"; then
                      echo "run=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "run=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: E2E
              if: ${{ steps.affected.outputs.run == 'true' && !matrix.visual }}
              env:
                  PROJECT: ${{ matrix.project }}
              # After `--`, so nx hands it to Playwright instead of reading it as an nx project.
              run: npx nx run web-e2e:e2e -- --project="$PROJECT"

            # Fails when feature-map.json has drifted from the feature folders or the specs; a feature
            # with no scenario is only listed. Once per run, so on one entry.
            - name: Feature coverage
              if: ${{ !cancelled() && steps.affected.outputs.run == 'true' && matrix.coverage }}
              run: npx nx run web-e2e:feature-coverage

            - name: Visual regression
              id: visual
              if: ${{ steps.affected.outputs.run == 'true' && matrix.visual }}
              continue-on-error: true
              run: npx nx run web-e2e:e2e-visual

            # `visual-result.json` says `pass`, `fail` (a screen differs or has no baseline) or
            # `error` (scenarios failed before comparing). No file means the run broke before the
            # reporter wrote one, which is an error too. A fork's token cannot write a status.
            - name: Visual regression status
              if: >-
                  ${{ !cancelled() && steps.affected.outputs.run == 'true' && matrix.visual
                  && github.event_name == 'pull_request'
                  && github.event.pull_request.head.repo.full_name == github.repository }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  SHA: ${{ github.event.pull_request.head.sha }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  result=dist/.playwright/apps/web-e2e/visual-result.json
                  status=$(node -p "try { require('./$result').status } catch { 'missing' }")
                  case "$status" in
                      pass) state=success; text="All screens match their baselines" ;;
                      fail) state=failure; text="A screen differs from its baseline or has none" ;;
                      *) state=error; text="The visual run broke before comparing ($status)" ;;
                  esac
                  echo "visual regression: $status → $state"
                  node -e '
                      const [repo, sha, state, description, target_url] = process.argv.slice(1);
                      fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`, {
                          method: "POST",
                          headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: "application/vnd.github+json" },
                          body: JSON.stringify({ state, description, target_url, context: "web-e2e/visual-regression" }),
                      }).then(async response => { if (!response.ok) { console.error(response.status, await response.text()); process.exit(1); } });
                  ' "$REPO" "$SHA" "$state" "$text" "$RUN_URL"

            - name: Upload the evidence
              if: ${{ !cancelled() && steps.affected.outputs.run == 'true' }}
              uses: actions/upload-artifact@v4
              with:
                  name: web-e2e-evidence-${{ matrix.project }}
                  path: dist/.playwright/apps/web-e2e/evidence
                  retention-days: 14

            - name: Upload the report
              if: ${{ failure() && steps.affected.outputs.run == 'true' }}
              uses: actions/upload-artifact@v4
              with:
                  name: web-e2e-report-${{ matrix.project }}
                  path: dist/.playwright/apps/web-e2e
                  retention-days: 14

    # Puts the e2e runs into the pull request: the key screenshots onto the orphan branch
    # `pr-assets/pr-<n>` and one "Verification results" comment (apps/web-e2e/README.md
    # § Verification results in the pull request). Nothing to publish when no e2e entry ran. A fork's
    # token cannot write, so a fork is skipped; `.github/workflows/pr-assets-cleanup.yml` deletes the
    # branch when the pull request closes.
    e2e-results:
        needs: e2e
        if: >-
            ${{ !cancelled() && github.event_name == 'pull_request'
            && github.event.pull_request.head.repo.full_name == github.repository }}
        name: web e2e · results in the pull request
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
                  sparse-checkout: apps/web-e2e/scripts

            - uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'

            - name: Download the evidence
              uses: actions/download-artifact@v4
              with:
                  pattern: web-e2e-evidence-*
                  path: ${{ runner.temp }}/evidence

            # The script pushes from a scratch repository of its own, so the token goes in the remote
            # URL; the runner masks it in the log.
            - name: Publish
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  PR: ${{ github.event.pull_request.number }}
                  RUN: ${{ github.run_id }}
                  EVIDENCE: ${{ runner.temp }}/evidence
              run: |
                  args=()
                  for dir in "$EVIDENCE"/*/; do
                      [ -f "$dir/summary.json" ] && args+=(--evidence "$dir")
                  done
                  if [ ${#args[@]} -eq 0 ]; then
                      echo "No e2e evidence in this run (web-e2e not affected); nothing to publish."
                      exit 0
                  fi
                  node apps/web-e2e/scripts/pr-verification.mjs publish --pr "$PR" --run "$RUN" --repo "$REPO" \
                      --remote-url "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" "${args[@]}"
