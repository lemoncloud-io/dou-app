name: desktop-native

on:
    pull_request:
        paths: &paths
            - apps/desktop-native/**
            - libs/auth/**
            - libs/transport/**
            - libs/data/**
            - libs/sync/**
            - libs/runtime-core/**
            - apps/web/public/locales/**
            - apps/web/src/i18n/**
            - .github/workflows/desktop-native.yml
    push:
        branches:
            - develop
        paths: *paths

permissions:
    contents: read

concurrency:
    group: desktop-native-${{ github.ref }}
    cancel-in-progress: true

jobs:
    rust:
        name: rust (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, windows-latest]
        defaults:
            run:
                working-directory: apps/desktop-native
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/desktop-native

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: yarn

            - run: yarn install --frozen-lockfile --ignore-scripts
              working-directory: .

            - run: npx nx run desktop-native:vectors-check
              working-directory: .

            - run: cargo fmt --check

            - run: cargo clippy --workspace --all-targets -- -D warnings

            - run: cargo test --workspace
