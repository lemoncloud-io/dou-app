name: desktop-native

on:
    pull_request:
        paths: &paths
            - apps/desktop-native/**
            - libs/auth/**
            - libs/transport/**
            - libs/data/**
            - libs/sync/**
            - libs/runtime-core/**
            - libs/runtime/**
            - libs/http/**
            - apps/web/public/locales/**
            - apps/web/src/i18n/**
            - .github/workflows/desktop-native.yml
    push:
        branches:
            - develop
        paths: *paths

permissions:
    contents: read

concurrency:
    group: desktop-native-${{ github.ref }}
    cancel-in-progress: true

jobs:
    rust:
        name: rust (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, windows-latest]
        defaults:
            run:
                working-directory: apps/desktop-native
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/desktop-native
                  save-if: ${{ github.event_name != 'pull_request' }}

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc

            - name: Get Yarn cache path
              id: yarn-cache-dir-path
              shell: bash
              working-directory: .
              run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

            - name: Restore the yarn cache
              id: yarn-cache
              uses: actions/cache/restore@v4
              with:
                  path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
                  key: ${{ runner.os }}-desktop-yarn-${{ hashFiles('yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-desktop-yarn-

            - run: yarn install --frozen-lockfile --ignore-scripts
              working-directory: .

            - name: Save the yarn cache
              if: ${{ github.event_name != 'pull_request' && steps.yarn-cache.outputs.cache-hit != 'true' }}
              uses: actions/cache/save@v4
              with:
                  path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
                  key: ${{ steps.yarn-cache.outputs.cache-primary-key }}

            - run: npx nx run desktop-native:vectors-check
              working-directory: .

            - run: cargo fmt --check

            - run: cargo clippy --locked --workspace --all-targets -- -D warnings

            - run: cargo test --locked --workspace
