name: mobile-release-finish

on:
    workflow_dispatch:
        inputs:
            tag:
                description: 'mobile-v<version>-<build> tag pushed after a successful upload'
                type: string
                required: true
            env:
                description: 'dev or prod; empty reads it from the tag message'
                type: string
                required: false
            platform:
                description: 'Result per platform, e.g. ios=uploaded,android=failed; empty reads them from the tag message'
                type: string
                required: false
            store_notes:
                description: 'Store notes; empty reads them from the tag message'
                type: string
                required: false
            team_notes:
                description: English team notes; empty generates them from the commits in the build
                type: string
                required: false
    workflow_call:
        inputs:
            tag:
                type: string
                required: true
            env:
                type: string
                required: false
            platform:
                type: string
                required: false
            store_notes:
                type: string
                required: false
            team_notes:
                type: string
                required: false
        outputs:
            url:
                value: ${{ jobs.finish.outputs.url }}

permissions:
    contents: read

concurrency:
    group: mobile-release-finish-${{ inputs.tag }}
    cancel-in-progress: false

env:
    SKIP_MOBILE_POD: '1'

jobs:
    finish:
        name: Release, PR comments and card
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: write
            pull-requests: write
            issues: write
        outputs:
            url: ${{ steps.finish.outputs.url }}
        steps:
            - name: Check the tag name
              env:
                  TAG: ${{ inputs.tag }}
              run: |
                  [[ "$TAG" =~ ^mobile-v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]] || { echo "::error::tag must be mobile-v<version>-<build> (got $TAG)"; exit 1; }

            - uses: actions/checkout@v4
              id: checkout
              with:
                  ref: refs/tags/${{ inputs.tag }}
                  fetch-depth: 0
                  fetch-tags: true

            - uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'

            - name: Install dependencies
              run: |
                  for i in 1 2 3; do
                    yarn install --frozen-lockfile && exit 0
                    echo "install attempt $i failed; retrying in 30s"
                    sleep 30
                  done
                  exit 1

            - name: Release and comment
              id: finish
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ inputs.tag }}
                  TARGET_ENV: ${{ inputs.env }}
                  PLATFORMS: ${{ inputs.platform }}
                  STORE_NOTES: ${{ inputs.store_notes }}
                  TEAM_NOTES: ${{ inputs.team_notes }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  ACTOR: ${{ github.actor }}
              run: |
                  set -euo pipefail
                  ARGS=("$TAG" --run-url "$RUN_URL" --actor "$ACTOR"
                        --body-file "$RUNNER_TEMP/release-body.md" --card-notes-out "$RUNNER_TEMP/card-notes.md")
                  [ -n "$TARGET_ENV" ] && ARGS+=(--env "$TARGET_ENV")
                  [ -n "$PLATFORMS" ] && ARGS+=(--platforms "$PLATFORMS")
                  [ -n "$STORE_NOTES" ] && ARGS+=(--store-notes "$STORE_NOTES")
                  [ -n "$TEAM_NOTES" ] && ARGS+=(--team-notes "$TEAM_NOTES")
                  node scripts/mobile-release/finish.js "${ARGS[@]}"

            - name: Prepare the card
              id: msg
              if: ${{ always() }}
              env:
                  TAG: ${{ inputs.tag }}
                  RESULT: ${{ steps.finish.outcome }}
                  CHECKOUT: ${{ steps.checkout.outcome }}
                  URL: ${{ steps.finish.outputs.url }}
                  F_ENV: ${{ steps.finish.outputs.env }}
                  F_RESULTS: ${{ steps.finish.outputs.results }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  set -euo pipefail
                  MESSAGE=$(git tag -l --format='%(contents)' "$TAG" 2>/dev/null || true)
                  TARGET_ENV=${F_ENV:-$(printf '%s\n' "$MESSAGE" | sed -n 's/^env: //p' | head -1)}
                  RESULTS=${F_RESULTS:-$(printf '%s\n' "$MESSAGE" | sed -n 's/^results: //p' | head -1)}
                  VERSION=$(printf '%s' "$TAG" | sed -E 's/^mobile-v([0-9.]+)-([0-9]+)$/\1 (\2)/')
                  LABEL="DoU 모바일 ${TARGET_ENV:-?} $VERSION"
                  count() { printf '%s' "$RESULTS" | tr ',' '\n' | grep -cE "=[[:space:]]*($1)[[:space:]]*$" || true; }
                  NOT_UPLOADED=$(count 'failed|skipped')
                  INCOMPLETE=$(count incomplete)
                  if [ "$CHECKOUT" != "success" ]; then
                    STATUS=failure; TITLE="$LABEL 태그 없음"
                    BODY="• $TAG 태그를 origin에서 찾지 못해 릴리스를 만들지 않았습니다"$'\n'"• 로그: $RUN_URL"
                  elif [ "$RESULT" = "success" ]; then
                    if [ "$NOT_UPLOADED" != "0" ]; then
                      STATUS=failure; TITLE="$LABEL 일부만 업로드"
                      BODY="• 결과: ${RESULTS:-?}"$'\n'"• 빠진 플랫폼: yarn mobile:release dev --tag $TAG"$'\n'"• 릴리스: $URL"
                    elif [ "$INCOMPLETE" != "0" ]; then
                      STATUS=failure; TITLE="$LABEL 업로드 완료, 확인 필요"
                      BODY="• 결과: ${RESULTS:-?}"$'\n'"• incomplete: 스토어에는 올라갔지만 레인이 그 뒤에 실패. 스토어 노트를 확인하세요"$'\n'"• 릴리스: $URL"
                    else
                      STATUS=success; TITLE="$LABEL 업로드 완료"
                      BODY="• 결과: ${RESULTS:-?}"$'\n'"• 릴리스: $URL"
                    fi
                    if [ -f "$RUNNER_TEMP/card-notes.md" ]; then BODY="$BODY"$'\n\n'"$(cat "$RUNNER_TEMP/card-notes.md")"; fi
                  else
                    STATUS=failure; TITLE="$LABEL 마무리 실패"
                    BODY="• 업로드와 태그는 끝남. 릴리스 · PR 댓글이 실패"$'\n'"• 다시: yarn mobile:release finish $TAG"$'\n'"• 로그: $RUN_URL"
                  fi
                  {
                    echo "status=$STATUS"
                    echo "title=$TITLE"
                    echo "body<<MOBILE_RELEASE_EOF"
                    echo "$BODY"
                    echo "MOBILE_RELEASE_EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Notify DoU
              if: ${{ always() && steps.msg.outcome == 'success' }}
              uses: lemoncloud-io/actions/notify-dou@v1
              with:
                  url: ${{ secrets.DOU_WEBHOOK_URL }}
                  token: ${{ secrets.DOU_WEBHOOK_TOKEN }}
                  channel-id: ${{ secrets.DOU_CHANNEL_ID }}
                  status: ${{ steps.msg.outputs.status }}
                  title: ${{ steps.msg.outputs.title }}
                  text: ${{ steps.msg.outputs.body }}
