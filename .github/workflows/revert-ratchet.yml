name: revert ratchet

# A merged revert means a mistake reached develop. This opens an issue, labelled `ratchet`, that
# proposes a candidate rule or test and asks for an adversarial check (counterexamples where the
# rule would fire on a correct change) before a person approves it.
#
# `pull_request_target` for the issue-writing token; nothing from the pull request's branch runs.
# The title and body reach the script through the event file, never through shell interpolation.
#
# The `test` job runs the tests of this script and of `scripts/comment-only-diff`, which no other
# CI step covers, on a plain `pull_request` with a read-only token.

on:
    pull_request_target:
        types: [closed]
        branches: [develop]
    pull_request:
        paths:
            - 'scripts/revert-ratchet/**'
            - 'scripts/comment-only-diff/**'
            - '.github/workflows/revert-ratchet.yml'

permissions: {}

jobs:
    test:
        if: github.event_name == 'pull_request'
        name: revert-ratchet and comment-only-diff tests
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
            - name: Install TypeScript
              run: npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/ts" typescript@5.9.3
            - name: Test
              env:
                  NODE_PATH: ${{ runner.temp }}/ts/node_modules
              run: node --test 'scripts/revert-ratchet/__tests__/*.test.js' 'scripts/comment-only-diff/__tests__/*.test.js'

    ratchet:
        if: >-
            github.event_name == 'pull_request_target'
            && github.event.pull_request.merged && startsWith(github.event.pull_request.title, 'Revert')
        name: open a ratchet issue
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
            issues: write
        env:
            GH_TOKEN: ${{ github.token }}
            REPO: ${{ github.repository }}
            NUMBER: ${{ github.event.pull_request.number }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: develop
                  persist-credentials: false
                  sparse-checkout: scripts/revert-ratchet

            - uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'

            - name: Find the reverted pull request
              id: find
              run: |
                  gh api --paginate "repos/$REPO/pulls/$NUMBER/commits" --jq '[.[].commit.message]' | jq -s 'add' > "$RUNNER_TEMP/messages.json"
                  jq --slurpfile m "$RUNNER_TEMP/messages.json" '{title: .pull_request.title, body: (.pull_request.body // ""), commitMessages: $m[0]}' \
                      "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/revert.json"
                  node scripts/revert-ratchet/revert.js targets "$RUNNER_TEMP/revert.json" > "$RUNNER_TEMP/targets.json"
                  original=$(jq -r '.numbers[0] // empty' "$RUNNER_TEMP/targets.json")
                  if [ -z "$original" ]; then
                      for sha in $(jq -r '.shas[]' "$RUNNER_TEMP/targets.json"); do
                          original=$(gh api "repos/$REPO/commits/$sha/pulls" --jq "[.[] | select(.merged_at != null and .number != $NUMBER)][0].number // empty" || true)
                          [ -n "$original" ] && break
                      done
                  fi
                  if [ -z "$original" ]; then
                      reverted=$(jq -r '.revertedTitle // empty' "$RUNNER_TEMP/targets.json")
                      if [ -n "$reverted" ]; then
                          original=$(gh pr list -R "$REPO" --state merged --base develop --limit 50 --json number,title \
                              | jq -r --arg t "$reverted" '[.[] | select(.title == $t)][0].number // empty')
                      fi
                  fi
                  if [ -n "$original" ]; then
                      gh pr view "$original" -R "$REPO" --json number,title,files \
                          | jq '{number, title, files: [.files[].path]}' > "$RUNNER_TEMP/original.json"
                  else
                      echo 'null' > "$RUNNER_TEMP/original.json"
                  fi
                  jq -n --argjson n "$NUMBER" --slurpfile o "$RUNNER_TEMP/original.json" '{revert: {number: $n}, original: $o[0]}' > "$RUNNER_TEMP/issue.json"
                  echo "original=$original" >> "$GITHUB_OUTPUT"

            - name: Open the issue
              env:
                  ORIGINAL: ${{ steps.find.outputs.original }}
              run: |
                  gh label create ratchet -R "$REPO" --color 5319e7 \
                      --description 'Turn a mistake that reached develop into a rule or a test' 2>/dev/null || true
                  title="Ratchet: catch what #${ORIGINAL:-?} needed reverting (reverted in #$NUMBER)"
                  if gh issue list -R "$REPO" --label ratchet --state all --search "\"reverted in #$NUMBER\" in:title" --json number --jq 'length' | grep -qv '^0$'; then
                      echo "A ratchet issue for #$NUMBER already exists."
                      exit 0
                  fi
                  node scripts/revert-ratchet/revert.js issue "$RUNNER_TEMP/issue.json" > "$RUNNER_TEMP/issue.md"
                  gh issue create -R "$REPO" --title "$title" --label ratchet --body-file "$RUNNER_TEMP/issue.md"
