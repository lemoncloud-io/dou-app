name: build-desktop-tauri

on:
    workflow_dispatch:
        inputs:
            stage:
                description: Stage the installers talk to
                type: choice
                options:
                    - dev
                    - prod
                default: dev
    pull_request:
        paths:
            - apps/desktop-tauri/**
            - apps/dou-cli/**
            - libs/agent-tools/**
            - .github/workflows/build-desktop-tauri.yml

permissions:
    contents: read

concurrency:
    group: build-desktop-tauri-${{ github.ref }}
    cancel-in-progress: true

env:
    SKIP_MOBILE_POD: '1'
    BUILD_STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'dev' }}

jobs:
    installer:
        name: installer (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                      bundles: dmg
                      artifact: apps/desktop-tauri/target/release/bundle/dmg/*.dmg
                    - os: windows-latest
                      bundles: nsis
                      artifact: apps/desktop-tauri/target/release/bundle/nsis/*.exe
        steps:
            - uses: actions/checkout@v4

            - name: pick the web address and stage
              if: env.BUILD_STAGE == 'dev'
              shell: bash
              run: |
                  echo 'DOU_WEB_URL=https://dou-dev.chatic.io' >> "$GITHUB_ENV"
                  echo 'DOU_STAGE=dev' >> "$GITHUB_ENV"

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/desktop-tauri
                  save-if: ${{ github.event_name != 'pull_request' }}

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc

            - name: Get Yarn cache path
              id: yarn-cache-dir-path
              shell: bash
              run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

            - name: Restore the yarn cache
              id: yarn-cache
              uses: actions/cache/restore@v4
              with:
                  path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
                  key: ${{ runner.os }}-desktop-yarn-${{ hashFiles('yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-desktop-yarn-

            - run: yarn install --frozen-lockfile --ignore-scripts

            - name: Save the yarn cache
              if: ${{ github.event_name != 'pull_request' && steps.yarn-cache.outputs.cache-hit != 'true' }}
              uses: actions/cache/save@v4
              with:
                  path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
                  key: ${{ steps.yarn-cache.outputs.cache-primary-key }}

            - name: build the dou-cli sidecar
              shell: bash
              run: |
                  yarn nx build dou-cli
                  node apps/dou-cli/scripts/build-sidecar.mjs "$GITHUB_WORKSPACE/apps/desktop-tauri/src-tauri/binaries"

            - name: run the sidecar once
              shell: bash
              working-directory: apps/desktop-tauri/src-tauri/binaries
              run: |
                  ls
                  ./dou-cli-* --help

            - name: stage dou-mcp
              working-directory: apps/desktop-tauri
              run: node scripts/stage-dou-mcp.mjs

            - run: cargo install tauri-cli --locked --version '^2'

            - name: build the installer
              shell: bash
              working-directory: apps/desktop-tauri/src-tauri
              run: cargo tauri build --bundles ${{ matrix.bundles }} --config tauri.sidecar.conf.json -- --locked

            - name: run the bundled sidecar once
              if: runner.os == 'macOS'
              shell: bash
              run: |
                  mnt="$(mktemp -d)"
                  hdiutil attach -nobrowse -readonly -mountpoint "$mnt" apps/desktop-tauri/target/release/bundle/dmg/*.dmg
                  "$mnt"/*.app/Contents/MacOS/dou-cli --help
                  hdiutil detach -force "$mnt"

            - name: list the installer contents
              shell: bash
              run: ls -l ${{ matrix.artifact }}

            - uses: actions/upload-artifact@v4
              with:
                  name: dou-tauri-${{ matrix.bundles }}
                  path: ${{ matrix.artifact }}
                  if-no-files-found: error
