[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
