<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>DoU</title>
        <style>
            :root {
                color-scheme: light dark;
            }
            body {
                margin: 0;
                height: 100vh;
                display: grid;
                place-items: center;
                font:
                    15px system-ui,
                    sans-serif;
            }
            main {
                text-align: center;
                max-width: 320px;
                padding: 24px;
            }
            button {
                font: inherit;
                padding: 8px 18px;
                margin-top: 12px;
            }
            [hidden] {
                display: none;
            }
        </style>
    </head>
    <body>
        <main>
            <p id="status">Connecting…</p>
            <p id="detail" hidden>Cannot reach the server. Retrying.</p>
            <button id="retry" type="button" hidden>Try now</button>
        </main>
        <script src="loader.js"></script>
    </body>
</html>
