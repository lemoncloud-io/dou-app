[package]
name = "dou-tauri"
description = "DoU desktop shell (Tauri) showing apps/web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "dou-tauri"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
base64 = "0.22"
vault = { path = "../crates/vault" }
dou-app = { path = "../../desktop-native/crates/dou-app" }
dou-auth = { path = "../../desktop-native/crates/dou-auth" }
dou-control = { path = "../../desktop-native/crates/dou-control" }
dou-http = { path = "../../desktop-native/crates/dou-http" }
dou-socket = { path = "../../desktop-native/crates/dou-socket" }
dou-core = { path = "../../desktop-native/crates/dou-core" }
agent-settings = { path = "../crates/agent-settings" }
connectors = { path = "../crates/connectors" }
dou-mcp = { path = "../../desktop-native/crates/dou-mcp" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
serde.workspace = true
serde_json.workspace = true
url = "2"
uuid = { version = "1", features = ["v4"] }
sys-locale = "0.3"
bridge-host = { path = "../crates/bridge-host" }
