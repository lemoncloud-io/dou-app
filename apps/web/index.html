<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>DoU</title>
        <base href="/" />

        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
        <meta name="theme-color" id="theme-color-meta" content="#ffffff" />
        <!-- Perf timing baseline -->
        <script>
            window.__T0 = Date.now();
            console.log('[PERF] HTML_START ' + window.__T0);
        </script>
        <!-- Theme detection script - must run before any content renders -->
        <script>
            (function () {
                var storageKey = 'vite-ui-theme';
                // Local cache -> theme injected by the native shell (window.CHATIC_APP_THEME, set by
                // injectedJavaScriptBeforeContentLoaded) -> light. The injection is what keeps a wiped
                // WebView cache from painting the wrong colors on the very first frame; a bridge
                // message would arrive too late. Default is light, never the OS scheme: web and native
                // resolve 'system' independently, so it cannot decide the default without risking a
                // mismatch. Keep this order in sync with readInitialTheme() in usePreferenceStore.
                var theme = localStorage.getItem(storageKey) || window.CHATIC_APP_THEME || 'light';
                var isDark =
                    theme === 'dark' ||
                    (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);

                if (isDark) {
                    document.documentElement.classList.add('dark');
                    document.getElementById('theme-color-meta').content = '#121212';
                    document.documentElement.style.setProperty('--splash-bg', '#121212');
                } else {
                    document.documentElement.classList.remove('dark');
                    document.getElementById('theme-color-meta').content = '#ffffff';
                    document.documentElement.style.setProperty('--splash-bg', '#ffffff');
                }
            })();
        </script>
        <!-- Prevent white flash on iOS WebView resume / repaint -->
        <style>
            html,
            body {
                background-color: #ffffff;
            }
            html.dark,
            html.dark body {
                background-color: #121212;
            }
        </style>
        <!-- Preconnect: Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!-- Favicon -->
        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />
        <link rel="stylesheet" href="/src/styles.css" />
    </head>
    <body>
        <div id="root">
            <div
                id="splash"
                style="
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    height: 100dvh;
                    background: var(--splash-bg, #ffffff);
                "
            >
                <img src="/logo.png" alt="" width="96" height="96" />
            </div>
        </div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
