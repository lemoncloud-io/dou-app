<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>DoU</title>
        <base href="/" />

        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
        <meta name="theme-color" id="theme-color-meta" content="#ffffff" />
        <!-- Perf timing baseline -->
        <script>
            window.__T0 = Date.now();
            console.log('[PERF] HTML_START ' + window.__T0);
        </script>
        <!-- Theme detection script - must run before any content renders -->
        <script>
            (function () {
                var storageKey = 'vite-ui-theme';
                var theme = localStorage.getItem(storageKey);
                var isDark =
                    theme === 'dark' ||
                    (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);

                if (isDark) {
                    document.documentElement.classList.add('dark');
                    document.getElementById('theme-color-meta').content = '#121212';
                } else {
                    document.documentElement.classList.remove('dark');
                    document.getElementById('theme-color-meta').content = '#ffffff';
                }
            })();
        </script>
        <!-- Prevent white flash on iOS WebView resume / repaint -->
        <style>
            html,
            body {
                background-color: #ffffff;
            }
            html.dark,
            html.dark body {
                background-color: #121212;
            }
        </style>
        <!-- Preconnect: Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!-- Favicon -->
        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />
        <link rel="stylesheet" href="/src/styles.css" />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
