<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="DoU Block Kit Builder">
    <!-- The four supported blocks, stacked as they read in a message: a header
         bar, a divider, a section, and a two-column field row. The accent is the
         app's own --primary (76 63% 44%). -->
    <rect width="32" height="32" rx="7" fill="#1c1c1a" />
    <rect x="7" y="8" width="14" height="3" rx="1.5" fill="#91b72a" />
    <rect x="7" y="14" width="18" height="1.5" rx="0.75" fill="#5b5f52" />
    <rect x="7" y="18.5" width="18" height="2.5" rx="1.25" fill="#d8dcd2" />
    <rect x="7" y="24" width="8" height="2.5" rx="1.25" fill="#7c8272" />
    <rect x="17" y="24" width="8" height="2.5" rx="1.25" fill="#7c8272" />
</svg>
